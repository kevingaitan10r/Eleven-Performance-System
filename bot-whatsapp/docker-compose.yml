services:
  eleven-bot:
    build: .
    container_name: eleven-bot
    restart: unless-stopped
    ports:
      - "7077:7077"
    volumes:
      - ./.sesion:/app/.sesion
      - ./datos:/app/datos
      - ./conocimiento:/app/conocimiento
      - ../panel-web:/panel-web
      - ./src:/app/src
    env_file:
      - .env
